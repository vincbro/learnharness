name: Fork release

# Fork auto-update feed (owner 2026-10-28): every push to main publishes a
# release on THIS repository, and the packaged app's updater reads it.
#   - Version is 1.0.<run number>, set at build time (extraMetadata), so
#     package.json and upstream merges stay untouched.
#   - Windows/Linux are unsigned (as upstream) and self-update normally.
#   - macOS is unsigned and not notarized: Squirrel.Mac can't apply an
#     update to an ad-hoc signed app, so those builds are baked with
#     lhUpdateMode "notify" — the app shows a banner linking to the
#     release page instead (electron/main.cjs).
#   - Never runs on upstream, which ships signed builds via release.yml.

on:
  push:
    branches: [main]

permissions:
  contents: read

# One release at a time, in push order; never cancel an upload in flight.
concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"
  VERSION: 1.0.${{ github.run_number }}

jobs:
  quality:
    name: Release gates
    if: github.repository != 'amosblomqvist/learnharness'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  draft:
    name: Prepare one draft
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Preparing once avoids the publisher's list-miss/create race between OS jobs.
      # The draft stays hidden from the updater until every platform has uploaded.
      - name: Create or reuse the version's draft
        uses: actions/github-script@v9
        with:
          script: |
            const {owner, repo} = context.repo;
            const tag = `v${process.env.VERSION}`;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            const match = releases.find(release => release.tag_name === tag);
            if (match) {
              if (!match.draft) throw new Error(`${tag} is already published; refusing to modify it.`);
              core.info(`Reusing draft ${match.id} for ${tag}`);
              return;
            }
            const {data} = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, target_commitish: context.sha, name: process.env.VERSION, draft: true,
            });
            core.info(`Created draft ${data.id} for ${tag}`);

  package:
    name: Package (${{ matrix.platform }})
    needs: [quality, draft]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: mac-arm64
            builder_args: --mac --arm64
          - os: windows-2025
            platform: windows-x64
            builder_args: --win --x64
          - os: ubuntu-24.04
            platform: linux-x64
            builder_args: --linux --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      # The mac icon is the Icon Composer document (build/icon.icon);
      # compiling it needs macOS 26+ and actool ≥ 26 (Xcode 26+).
      - name: Select Xcode 26+ for actool (mac icon compile)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - name: Native renderer tests on this OS
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - run: npm run build
      # Check the fresh trace before any static copying/curation.
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
      # The -c.publish.* overrides apply to the first publish entry, so the
      # feed baked into the app (app-update.yml) and the upload target are
      # this repository; releaseType stays draft from electron-builder.yml.
      - name: Unsigned macOS release (notify-only updates) → draft
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: >-
          npx electron-builder ${{ matrix.builder_args }} --publish always
          -c.mac.notarize=false
          -c.extraMetadata.version="$VERSION"
          -c.extraMetadata.lhUpdateMode=notify
          -c.extraMetadata.lhReleasesUrl="https://github.com/$GITHUB_REPOSITORY/releases/latest"
          -c.publish.owner="$GITHUB_REPOSITORY_OWNER"
          -c.publish.repo="${GITHUB_REPOSITORY#*/}"
      - name: Windows/Linux release → draft
        if: runner.os != 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npx electron-builder ${{ matrix.builder_args }} --publish always
          -c.extraMetadata.version="$VERSION"
          -c.publish.owner="$GITHUB_REPOSITORY_OWNER"
          -c.publish.repo="${GITHUB_REPOSITORY#*/}"
      - name: Initialize packaged providers offline (host and packaged Electron Node)
        run: |
          case "$RUNNER_OS" in
            macOS)
              app="dist/mac-arm64/LearnHarness.app/Contents"
              payload="$app/Resources/server/standalone"
              runtime="$app/MacOS/LearnHarness"
              ;;
            Windows)
              payload="dist/win-unpacked/resources/server/standalone"
              runtime="dist/win-unpacked/LearnHarness.exe"
              ;;
            Linux)
              payload="dist/linux-unpacked/resources/server/standalone"
              runtime="dist/linux-unpacked/learnharness"
              ;;
          esac
          node scripts/smoke-provider-runtime.mjs --standalone "$payload"
          node scripts/smoke-provider-runtime.mjs --standalone "$payload" --runtime "$runtime"
      - name: Exercise packaged demo runtime (own Electron, no system Chrome)
        run: |
          case "$RUNNER_OS" in
            macOS)
              app="dist/mac-arm64/LearnHarness.app/Contents"
              node scripts/smoke-demo-runtime.mjs --standalone "$app/Resources/server/standalone" --runtime "$app/MacOS/LearnHarness" --browser
              ;;
            Windows)
              node scripts/smoke-demo-runtime.mjs --standalone dist/win-unpacked/resources/server/standalone --runtime dist/win-unpacked/LearnHarness.exe --browser
              ;;
            Linux)
              xvfb-run -a node scripts/smoke-demo-runtime.mjs --standalone dist/linux-unpacked/resources/server/standalone --runtime dist/linux-unpacked/learnharness --browser
              ;;
          esac

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Only after every platform uploaded: the updater then sees a complete release.
      - name: Publish the draft as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
